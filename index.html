        {"@type":"Question","name":"Was genau wird gemessen?","acceptedAnswer":{"@type":"Answer","text":"Nur die Fokuszeit während der Arbeitszeit: Die Fokus-Uhr läuft, solange konzentriert gearbeitet wird, und stoppt bei privater Nutzung. Keine Inhalte, keine Screenshots, keine Tastatureingaben – ausschließlich Zeitdaten. Das Team mit der meisten Fokuszeit gewinnt."}},
